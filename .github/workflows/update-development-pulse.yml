name: Update Development Pulse

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: development-pulse
  cancel-in-progress: false

jobs:
  update:
    name: Update Development Pulse
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. DEPENDÊNCIAS
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ============================================================
      # 4. EXECUTA O SCRIPT PROFISSIONAL
      # ============================================================
      - name: Update Development Pulse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Wesleybarroso
        run: |
          python scripts/update_languages.py

      # ============================================================
      # 5. VERIFICA ALTERAÇÕES
      # ============================================================
      - name: Check changes
        id: changes
        run: |
          if git diff --quiet -- assets/languages-month.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração no SVG."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "SVG alterado."
          fi

      # ============================================================
      # 6. COMMIT + PUSH
      # ============================================================
      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/languages-month.svg

          git commit -m "chore: atualizar Development Pulse"

          git push

      # ============================================================
      # 7. LIMPEZA DAS EXECUÇÕES ANTIGAS
      #
      # Mantém aproximadamente as últimas 24 horas.
      #
      # A limpeza é executada somente uma vez por hora para evitar
      # chamadas desnecessárias à API do GitHub.
      # ============================================================
      - name: Cleanup old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: update-development-pulse.yml
        run: |
          CURRENT_MINUTE=$(date -u +%M)

          if [ "$CURRENT_MINUTE" != "00" ]; then
            echo "Limpeza não necessária neste minuto."
            exit 0
          fi

          echo "Iniciando limpeza das execuções antigas..."

          CUTOFF=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')

          echo "Mantendo execuções desde: $CUTOFF"

          PAGE=1

          while true; do

            RESPONSE=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?per_page=100&page=$PAGE")

            RUNS=$(echo "$RESPONSE" | jq -c '.workflow_runs[]')

            if [ -z "$RUNS" ]; then
              break
            fi

            echo "$RUNS" | while read -r RUN; do

              RUN_ID=$(echo "$RUN" | jq -r '.id')
              CREATED_AT=$(echo "$RUN" | jq -r '.created_at')
              STATUS=$(echo "$RUN" | jq -r '.status')

              if [ "$STATUS" != "completed" ]; then
                continue
              fi

              if [[ "$CREATED_AT" < "$CUTOFF" ]]; then

                echo "Removendo execução:"
                echo "  ID: $RUN_ID"
                echo "  Criada: $CREATED_AT"

                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  -X DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "X-GitHub-Api-Version: 2026-03-10" \
                  "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID")

                if [ "$HTTP_CODE" = "204" ]; then
                  echo "  ✓ Execução removida."
                else
                  echo "  ⚠ Não foi possível remover. HTTP $HTTP_CODE"
                fi

              fi

            done

            TOTAL=$(echo "$RESPONSE" | jq '.workflow_runs | length')

            if [ "$TOTAL" -lt 100 ]; then
              break
            fi

            PAGE=$((PAGE + 1))

          done

          echo "Limpeza concluída."
