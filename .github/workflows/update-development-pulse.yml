name: Update Development Pulse

on:

  schedule:

    # Executa todos os dias às 06:00 UTC
    - cron: "0 6 * * *"

  # Permite executar manualmente
  workflow_dispatch:


permissions:

  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip
          pip install requests


      - name: Generate monthly language SVG

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GITHUB_USERNAME: Wesleybarroso

        run: |

          python scripts/update_languages.py


      - name: Commit and push

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/languages-month.svg

          if git diff --cached --quiet; then

            echo "Nenhuma alteração no Development Pulse."

            exit 0

          fi

          git commit -m "chore: update development pulse"

          git push
