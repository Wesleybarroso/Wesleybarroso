<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="1120" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#05080F"/>
    <stop offset="0.52" stop-color="#0A111C"/>
    <stop offset="1" stop-color="#05080F"/>
  </linearGradient>

  <linearGradient id="blue" x1="70" y1="0" x2="1330" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#00E5FF"/>
    <stop offset="0.5" stop-color="#1D7CFF"/>
    <stop offset="1" stop-color="#5B6CFF"/>
  </linearGradient>

  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#1B466F"/>
    <stop offset="0.55" stop-color="#0D2238"/>
    <stop offset="1" stop-color="#173A60"/>
  </linearGradient>

  <radialGradient id="spot" cx="0" cy="0" r="1" gradientTransform="translate(1080 260) rotate(90) scale(240)">
    <stop stop-color="#00E5FF" stop-opacity=".12"/>
    <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
  </radialGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="soft">
    <feGaussianBlur stdDeviation="24"/>
  </filter>

  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" stroke="#6EA9FF" stroke-opacity=".028"/>
  </pattern>

  <style>
    .eyebrow{font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:700;letter-spacing:3px;fill:#57D9FF}
    .h1{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:800;fill:#F7FAFC}
    .h2{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#EEF4FB}
    .label{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#DCE7F3}
    .copy{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#91A2B7}
    .tiny{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:1.7px;fill:#54718F}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#64E6FF}
  </style>
</defs>

<!-- CANVAS -->
<rect width="1400" height="1120" rx="28" fill="url(#bg)"/>
<rect width="1400" height="1120" rx="28" fill="url(#grid)"/>

<!-- subtle light -->
<ellipse cx="1080" cy="255" rx="290" ry="220" fill="url(#spot)" filter="url(#soft)">
  <animate attributeName="opacity" values=".65;1;.65" dur="6s" repeatCount="indefinite"/>
</ellipse>

<!-- frame corners -->
<path d="M28 74V28H74M1326 28H1372V74M28 1046V1092H74M1326 1092H1372V1046"
      fill="none" stroke="url(#blue)" stroke-width="1.7"/>

<!-- top identity -->
<text x="58" y="56" class="eyebrow">ALTIXDEV / ENGINEERING SYSTEM</text>
<text x="58" y="108" class="h1">Como eu transformo ideias em software</text>
<text x="58" y="138" class="copy">Processo claro. Código limpo. Produto preparado para crescer.</text>

<text x="1340" y="56" class="mono" text-anchor="end">ALTIXDEV</text>
<text x="1340" y="75" class="tiny" text-anchor="end">ENGINEERING WORKFLOW</text>

<!-- ================= WORKFLOW ================= -->
<text x="58" y="205" class="eyebrow">01 / COMO TRABALHO</text>
<line x1="58" y1="219" x2="1342" y2="219" stroke="#17314B"/>

<!-- flow rail -->
<line x1="102" y1="286" x2="1292" y2="286" stroke="#173650" stroke-width="2"/>
<line x1="102" y1="286" x2="1292" y2="286" stroke="url(#blue)" stroke-width="3"
      stroke-linecap="round" stroke-dasharray="2 22" opacity=".9">
  <animate attributeName="stroke-dashoffset" from="0" to="-144" dur="2.6s" repeatCount="indefinite"/>
</line>
<circle r="5" fill="#B9FAFF" filter="url(#glow)">
  <animateMotion dur="4.6s" repeatCount="indefinite" path="M102 286 H1292"/>
</circle>
<circle r="2.5" fill="#FFFFFF">
  <animateMotion dur="4.6s" begin="2.1s" repeatCount="indefinite" path="M102 286 H1292"/>
</circle>

<!-- stage helpers -->
<g>
  <!-- 01 -->
  <circle cx="102" cy="286" r="25" fill="#07111D" stroke="#1D7CFF" stroke-width="2"/>
  <circle cx="102" cy="286" r="7" fill="#00E5FF" filter="url(#glow)">
    <animate attributeName="r" values="6;9;6" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <text x="102" y="330" class="label" text-anchor="middle">01</text>
  <text x="102" y="350" class="copy" text-anchor="middle">Entendimento</text>

  <!-- 02 -->
  <circle cx="340" cy="286" r="25" fill="#07111D" stroke="#1D7CFF" stroke-width="2"/>
  <path d="M329 291L340 276L351 291L340 297Z" fill="none" stroke="#6AE9FF" stroke-width="2"/>
  <text x="340" y="330" class="label" text-anchor="middle">02</text>
  <text x="340" y="350" class="copy" text-anchor="middle">Planejamento</text>

  <!-- 03 -->
  <circle cx="578" cy="286" r="25" fill="#07111D" stroke="#1D7CFF" stroke-width="2"/>
  <text x="578" y="291" class="mono" text-anchor="middle">&lt;/&gt;</text>
  <text x="578" y="330" class="label" text-anchor="middle">03</text>
  <text x="578" y="350" class="copy" text-anchor="middle">Desenvolvimento</text>

  <!-- 04 -->
  <circle cx="816" cy="286" r="25" fill="#07111D" stroke="#1D7CFF" stroke-width="2"/>
  <path d="M805 286L813 294L828 277" fill="none" stroke="#6AE9FF" stroke-width="2.2"/>
  <text x="816" y="330" class="label" text-anchor="middle">04</text>
  <text x="816" y="350" class="copy" text-anchor="middle">Testes</text>

  <!-- 05 -->
  <circle cx="1054" cy="286" r="25" fill="#07111D" stroke="#1D7CFF" stroke-width="2"/>
  <path d="M1045 294L1054 273L1063 294" fill="none" stroke="#6AE9FF" stroke-width="2"/>
  <text x="1054" y="330" class="label" text-anchor="middle">05</text>
  <text x="1054" y="350" class="copy" text-anchor="middle">Deploy</text>

  <!-- 06 -->
  <circle cx="1292" cy="286" r="25" fill="#07111D" stroke="#1D7CFF" stroke-width="2"/>
  <path d="M1281 292L1290 282L1298 288L1307 277" fill="none" stroke="#6AE9FF" stroke-width="2"/>
  <text x="1292" y="330" class="label" text-anchor="middle">06</text>
  <text x="1292" y="350" class="copy" text-anchor="middle">Evolução</text>
</g>

<!-- micro descriptions -->
<g>
  <text x="102" y="383" class="tiny" text-anchor="middle">PROBLEMA</text>
  <text x="340" y="383" class="tiny" text-anchor="middle">ARQUITETURA</text>
  <text x="578" y="383" class="tiny" text-anchor="middle">BUILD</text>
  <text x="816" y="383" class="tiny" text-anchor="middle">VERIFY</text>
  <text x="1054" y="383" class="tiny" text-anchor="middle">SHIP</text>
  <text x="1292" y="383" class="tiny" text-anchor="middle">SCALE</text>
</g>

<!-- ================= TRANSFORMATION ================= -->
<rect x="58" y="425" width="1284" height="255" rx="22" fill="#070E18" stroke="url(#edge)"/>
<text x="86" y="461" class="eyebrow">02 / CICLO DE TRANSFORMAÇÃO</text>
<text x="86" y="496" class="h2">Da ideia ao produto</text>
<text x="86" y="520" class="copy">Um fluxo contínuo que conecta descoberta, engenharia e resultado.</text>
<path d="M370 560 H1160" stroke="#14314B" stroke-width="1"/>
<path d="M370 560 H1160" stroke="url(#blue)" stroke-width="2"
      stroke-linecap="round" stroke-dasharray="3 18">
  <animate attributeName="stroke-dashoffset" from="0" to="-126" dur="3s" repeatCount="indefinite"/>
</path>
<circle r="3.5" fill="#C7FCFF" filter="url(#glow)">
  <animateMotion dur="3.4s" repeatCount="indefinite" path="M370 560 H1160"/>
</circle>

<!-- visual chain -->
<g transform="translate(455 560)">
  <circle cx="0" cy="0" r="54" fill="#071523" stroke="#1D7CFF" stroke-width="2"/>
  <path d="M-16 5C-10-11 7-17 17-4C23 4 14 16 4 18" fill="none" stroke="#E7FBFF" stroke-width="2.2"/>
  <circle cx="0" cy="0" r="14" fill="#00E5FF" opacity=".28" filter="url(#glow)"/>
  <text x="0" y="83" class="mono" text-anchor="middle">IDEIA</text>
</g>

<g transform="translate(675 560)">
  <circle cx="0" cy="0" r="54" fill="#071523" stroke="#1D7CFF" stroke-width="2"/>
  <text x="0" y="6" class="mono" font-size="17" text-anchor="middle">&lt;/&gt;</text>
  <circle cx="0" cy="0" r="14" fill="#1683FF" opacity=".22" filter="url(#glow)"><animate attributeName="r" values="10;16;10" dur="2.8s" repeatCount="indefinite"/></circle>
  <text x="0" y="83" class="mono" text-anchor="middle">CÓDIGO</text>
</g>

<g transform="translate(895 560)">
  <circle cx="0" cy="0" r="54" fill="#071523" stroke="#00D9FF" stroke-width="2"/>
  <path d="M-17 8L0-17L17 8L0 19Z" fill="none" stroke="#E7FBFF" stroke-width="2.2"/>
  <circle cx="0" cy="0" r="14" fill="#00D9FF" opacity=".22" filter="url(#glow)"><animate attributeName="r" values="10;18;10" dur="2.6s" repeatCount="indefinite"/></circle>
  <text x="0" y="83" class="mono" text-anchor="middle">PRODUTO</text>
</g>

<path d="M509 560H621 M729 560H841" stroke="url(#blue)" stroke-width="2"/>
<circle r="4" fill="#00E5FF" filter="url(#glow)">
  <animateMotion dur="3.2s" repeatCount="indefinite" path="M509 560H621"/>
</circle>
<circle r="4" fill="#00E5FF" filter="url(#glow)">
  <animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite" path="M729 560H841"/>
</circle>

<text x="1090" y="548" class="tiny">LOOP</text>
<text x="1090" y="573" class="label">IDEIA → BUILD →</text>
<text x="1090" y="595" class="label">PRODUTO → MELHORIA</text>
<text x="1090" y="623" class="tiny">CONTINUOUS DELIVERY</text>

<!-- ================= DEVELOPER PANEL ================= -->
<text x="58" y="735" class="eyebrow">03 / PAINEL DO DESENVOLVEDOR</text>
<line x1="58" y1="749" x2="1342" y2="749" stroke="#17314B"/>

<rect x="58" y="774" width="1284" height="198" rx="22" fill="#070E18" stroke="url(#edge)"/>

<!-- four columns -->
<g>
  <line x1="370" y1="804" x2="370" y2="942" stroke="#17314B"/>
  <line x1="690" y1="804" x2="690" y2="942" stroke="#17314B"/>
  <line x1="1010" y1="804" x2="1010" y2="942" stroke="#17314B"/>

  <text x="88" y="812" class="tiny">FRONT-END</text>
  <text x="88" y="842" class="label">Interfaces</text>
  <text x="88" y="868" class="copy">React · TypeScript</text>
  <text x="88" y="890" class="copy">JavaScript · Vite · Next.js</text>
  <text x="88" y="924" class="tiny">01 / UI</text>

  <text x="400" y="812" class="tiny">BACK-END</text>
  <text x="400" y="842" class="label">Engenharia</text>
  <text x="400" y="868" class="copy">Node.js · Go</text>
  <text x="400" y="890" class="copy">Express · Fastify</text>
  <text x="400" y="924" class="tiny">02 / API</text>

  <text x="720" y="812" class="tiny">DATA</text>
  <text x="720" y="842" class="label">Persistência</text>
  <text x="720" y="868" class="copy">PostgreSQL · MySQL</text>
  <text x="720" y="890" class="copy">SQLite · Redis</text>
  <text x="720" y="924" class="tiny">03 / DATA</text>

  <text x="1040" y="812" class="tiny">INFRA</text>
  <text x="1040" y="842" class="label">Produção</text>
  <text x="1040" y="868" class="copy">Docker · Linux</text>
  <text x="1040" y="890" class="copy">Nginx · Traefik · Git</text>
  <text x="1040" y="924" class="tiny">04 / OPS</text>
</g>

<!-- ================= CURRENT FOCUS ================= -->
<text x="58" y="1024" class="eyebrow">04 / ATUALMENTE</text>
<rect x="300" y="990" width="1042" height="66" rx="17" fill="#08111D" stroke="#18324D"/>
<circle cx="326" cy="1023" r="6" fill="#00E5FF" filter="url(#glow)">
  <animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/>
</circle>
<text x="348" y="1018" class="label">Construindo produtos, APIs, automações e SaaS.</text>
<text x="348" y="1039" class="copy">Arquitetura • WhatsApp • Integrações • Infraestrutura • Escala</text>
<text x="1310" y="1028" class="mono" text-anchor="end">BUILDING</text>

<!-- footer -->
<line x1="58" y1="1083" x2="1342" y2="1083" stroke="#17314B"/>
<text x="58" y="1101" class="tiny">WESLEY BARROSO / SOFTWARE ENGINEER / FULL STACK DEVELOPER</text>
<text x="1342" y="1101" class="tiny" text-anchor="end">ALTIXDEV</text>
</svg>
