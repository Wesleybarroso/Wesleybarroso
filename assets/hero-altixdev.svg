<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#06132B"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#1683FF"/>
      <stop offset="1" stop-color="#0066FF"/>
    </linearGradient>

    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(800 260) rotate(90) scale(210)">
      <stop stop-color="#BFFFFF" stop-opacity=".95"/>
      <stop offset=".15" stop-color="#00D9FF" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#0066FF" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#1683FF" stroke-opacity=".08"/>
    </pattern>

    <clipPath id="clip">
      <rect width="1600" height="520" rx="24"/>
    </clipPath>

    <!-- Animated transition opacity -->
    <style>
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: 800px 260px; }
      .spin { animation: spin 12s linear infinite; transform-origin: 800px 260px; }
      .spin2 { animation: spin2 8s linear infinite; transform-origin: 800px 260px; }
      .float { animation: float 3.5s ease-in-out infinite; }
      .blink { animation: blink 2.6s ease-in-out infinite; }
      .orbit { animation: orbit 6s linear infinite; transform-origin: 800px 260px; }
      .dash { animation: dash 4s linear infinite; }
      @keyframes pulse {
        0%,100% { opacity:.55; transform:scale(.94); }
        50% { opacity:1; transform:scale(1.04); }
      }
      @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
      @keyframes spin2 { from { transform:rotate(360deg); } to { transform:rotate(0deg); } }
      @keyframes float {
        0%,100% { transform:translateY(0); }
        50% { transform:translateY(-8px); }
      }
      @keyframes blink {
        0%,20%,80%,100% { opacity:.35; }
        50% { opacity:1; }
      }
      @keyframes orbit { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
      @keyframes dash { to { stroke-dashoffset:-180; } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1600" height="520" fill="url(#bg)"/>
    <rect width="1600" height="520" fill="url(#grid)"/>

    <!-- HUD frame -->
    <path d="M24 86V24H86 M1514 24H1576V86 M24 434V496H86 M1514 496H1576V434"
          stroke="url(#blue)" stroke-width="2" opacity=".9"/>
    <path d="M24 118H330 M1270 118H1576 M24 402H330 M1270 402H1576"
          stroke="#1683FF" stroke-opacity=".3"/>

    <!-- Header -->
    <text x="62" y="62" fill="#7DD3FC" font-family="Arial, Helvetica, sans-serif"
          font-size="14" letter-spacing="3">&lt;/&gt; TRANSFORMANDO IDEIAS EM SOLUÇÕES</text>

    <text x="62" y="156" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif"
          font-size="62" font-weight="800" letter-spacing="2">WESLEY</text>
    <text x="62" y="218" fill="url(#blue)" font-family="Arial, Helvetica, sans-serif"
          font-size="62" font-weight="800" letter-spacing="2">BARROSO</text>

    <text x="64" y="255" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif"
          font-size="18" letter-spacing="5">SOFTWARE ENGINEER</text>
    <text x="64" y="283" fill="#00D9FF" font-family="Arial, Helvetica, sans-serif"
          font-size="15" letter-spacing="4">FULL STACK DEVELOPER</text>

    <rect x="58" y="318" width="340" height="72" rx="10" fill="#020617" fill-opacity=".78"
          stroke="#1683FF" stroke-opacity=".65"/>
    <text x="78" y="347" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="14">
      Meu objetivo não é apenas escrever código.
    </text>
    <text x="78" y="371" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif"
          font-size="14" font-weight="700">
      É transformar ideias em <tspan fill="#00D9FF">soluções</tspan>.
    </text>

    <!-- Central energy aura -->
    <circle cx="800" cy="260" r="210" fill="url(#core)" filter="url(#softGlow)" opacity=".55"/>
    <circle cx="800" cy="260" r="154" fill="none" stroke="#0066FF" stroke-opacity=".18" stroke-width="2"/>
    <circle cx="800" cy="260" r="126" fill="none" stroke="#00D9FF" stroke-opacity=".28"
            stroke-width="1.5" stroke-dasharray="6 12" class="spin"/>
    <circle cx="800" cy="260" r="102" fill="none" stroke="#1683FF" stroke-opacity=".35"
            stroke-width="2" stroke-dasharray="2 16" class="spin2"/>

    <!-- Transformation sequence -->
    <g class="float">
      <!-- Crystal -->
      <g filter="url(#glow)" class="pulse">
        <path d="M800 94 L858 176 L800 238 L742 176 Z" fill="#031A3D" stroke="url(#blue)" stroke-width="3"/>
        <path d="M800 94 L800 238 M742 176 L858 176 M800 94 L742 176 M800 94 L858 176"
              stroke="#8BE9FF" stroke-opacity=".65"/>
        <path d="M800 238 L780 184 L800 154 L820 184 Z" fill="#00D9FF" fill-opacity=".16"/>
      </g>

      <!-- Code cube -->
      <g opacity=".95" class="blink">
        <path d="M800 282 L864 318 L800 355 L736 318 Z" fill="#031A3D" stroke="#1683FF" stroke-width="2"/>
        <path d="M800 282V355 M736 318L800 355L864 318" stroke="#00D9FF" stroke-opacity=".7"/>
        <text x="771" y="324" fill="#7DD3FC" font-family="monospace" font-size="20">&lt;/&gt;</text>
      </g>

      <!-- Core -->
      <g class="pulse">
        <circle cx="800" cy="260" r="38" fill="#00D9FF" fill-opacity=".12" stroke="#00D9FF" stroke-width="2"/>
        <circle cx="800" cy="260" r="19" fill="#BFFFFF" filter="url(#glow)"/>
        <circle cx="800" cy="260" r="8" fill="#FFFFFF"/>
      </g>

      <!-- Rocket silhouette -->
      <g transform="translate(925 180) rotate(18)" class="float">
        <path d="M0 76 C10 30 32 8 52 0 C72 8 94 30 104 76 L52 102 Z"
              fill="#071B3B" stroke="url(#blue)" stroke-width="3"/>
        <circle cx="52" cy="40" r="10" fill="#00D9FF" fill-opacity=".2" stroke="#7DD3FC"/>
        <path d="M18 72 L0 94 L34 88 M86 72 L104 94 L70 88"
              stroke="#1683FF" stroke-width="4"/>
        <path d="M36 98 L52 132 L68 98" fill="#00D9FF" fill-opacity=".55"/>
      </g>

      <!-- Solution cube -->
      <g transform="translate(1010 280)" class="pulse">
        <path d="M52 0 L104 30 L52 60 L0 30 Z" fill="#0A2248" stroke="#00D9FF" stroke-width="2"/>
        <path d="M0 30V88L52 118V60 M104 30V88L52 118" fill="#061A37" stroke="#1683FF" stroke-width="2"/>
        <path d="M52 18L76 32L52 46L28 32Z" fill="#00D9FF" fill-opacity=".22"/>
      </g>
    </g>

    <!-- Connecting arrows -->
    <g stroke="url(#blue)" stroke-width="3" fill="none" filter="url(#glow)">
      <path d="M570 260 H650 L636 248 M650 260 L636 272"/>
      <path d="M900 260 H970 L956 248 M970 260 L956 272"/>
      <path d="M1110 260 H1180 L1166 248 M1180 260 L1166 272"/>
    </g>

    <!-- Labels -->
    <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
      <text x="510" y="405" fill="#7DD3FC" font-size="13" letter-spacing="2">01 • CRISTAL</text>
      <text x="510" y="426" fill="#64748B" font-size="11">IDEIA</text>

      <text x="800" y="405" fill="#7DD3FC" font-size="13" letter-spacing="2">02 • CÓDIGO</text>
      <text x="800" y="426" fill="#64748B" font-size="11">DESENVOLVIMENTO</text>

      <text x="1040" y="405" fill="#7DD3FC" font-size="13" letter-spacing="2">03 • NÚCLEO</text>
      <text x="1040" y="426" fill="#64748B" font-size="11">ARQUITETURA</text>

      <text x="1260" y="405" fill="#7DD3FC" font-size="13" letter-spacing="2">04 • DEPLOY</text>
      <text x="1260" y="426" fill="#64748B" font-size="11">ESCALA</text>
    </g>

    <!-- Right-side tech panel -->
    <rect x="1255" y="135" width="275" height="174" rx="12"
          fill="#020617" fill-opacity=".82" stroke="#1683FF" stroke-opacity=".6"/>
    <text x="1280" y="164" fill="#00D9FF" font-family="monospace" font-size="13">&gt;_ ALTIXDEV_ENGINE</text>
    <text x="1280" y="193" fill="#64748B" font-family="monospace" font-size="11">const solution = () =&gt; {</text>
    <text x="1298" y="216" fill="#7DD3FC" font-family="monospace" font-size="11">idea: true,</text>
    <text x="1298" y="237" fill="#7DD3FC" font-family="monospace" font-size="11">code: "clean",</text>
    <text x="1298" y="258" fill="#7DD3FC" font-family="monospace" font-size="11">deploy: "fast",</text>
    <text x="1298" y="279" fill="#00D9FF" font-family="monospace" font-size="11">scale: "infinite"</text>
    <text x="1280" y="300" fill="#64748B" font-family="monospace" font-size="11">}</text>

    <!-- Orbit particles -->
    <g class="orbit" fill="#00D9FF">
      <circle cx="800" cy="66" r="3"/>
      <circle cx="990" cy="260" r="2.5"/>
      <circle cx="800" cy="454" r="3"/>
      <circle cx="610" cy="260" r="2.5"/>
    </g>

    <g class="dash" stroke="#00D9FF" stroke-width="1.5" stroke-dasharray="8 14" opacity=".55">
      <path d="M430 260 H1170"/>
    </g>

    <!-- Bottom navigation -->
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="58" y="455" width="290" height="36" rx="8" fill="#061A37" stroke="#1683FF" stroke-opacity=".45"/>
      <text x="78" y="478" fill="#7DD3FC" font-size="12">🌐 altixdev.com.br</text>

      <rect x="365" y="455" width="290" height="36" rx="8" fill="#061A37" stroke="#1683FF" stroke-opacity=".45"/>
      <text x="385" y="478" fill="#7DD3FC" font-size="12">◉ wesleybarroso.com</text>

      <rect x="672" y="455" width="290" height="36" rx="8" fill="#061A37" stroke="#1683FF" stroke-opacity=".45"/>
      <text x="692" y="478" fill="#7DD3FC" font-size="12">&lt;/&gt; github.com/Wesleybarroso</text>

      <text x="1220" y="477" fill="#00D9FF" font-size="12" letter-spacing="2">IDEIA → CÓDIGO → DEPLOY → ESCALA</text>
    </g>

    <!-- Ambient particles -->
    <g fill="#00D9FF">
      <circle cx="420" cy="110" r="2" class="blink"/>
      <circle cx="455" cy="142" r="1.5" class="blink"/>
      <circle cx="1150" cy="102" r="2" class="blink"/>
      <circle cx="1190" cy="145" r="1.5" class="blink"/>
      <circle cx="1320" cy="350" r="2" class="blink"/>
      <circle cx="1400" cy="380" r="1.5" class="blink"/>
      <circle cx="360" cy="370" r="1.5" class="blink"/>
    </g>
  </g>
</svg>
